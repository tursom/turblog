name: Build and deploy

on:
  push:
    branches: [master]

concurrency:
  group: publish-master
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  VERSION: sha-${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate public site URL
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: test -n "$PUBLIC_SITE_URL"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify VPS deployment webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          test -n "$DEPLOY_WEBHOOK_URL"
          test -n "$DEPLOY_WEBHOOK_TOKEN"
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 30 \
            -X POST "${DEPLOY_WEBHOOK_URL%/}/v1/update" \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN"
