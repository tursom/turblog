services:
  blog:
    image: ${BLOG_IMAGE:-ghcr.io/tursom/turblog}:${BLOG_VERSION:-latest}
    restart: unless-stopped
    expose:
      - '8080'

  server:
    image: ${BLOG_IMAGE:-ghcr.io/tursom/turblog}:${BLOG_VERSION:-latest}
    restart: unless-stopped
    entrypoint:
      - /usr/local/bin/turblog-server
    user: '101:101'
    depends_on:
      - blog
    environment:
      TURBLOG_VISITOR_HASH_KEY: ${TURBLOG_VISITOR_HASH_KEY:?TURBLOG_VISITOR_HASH_KEY is required}
    ports:
      - '${BLOG_PORT:-8080}:8080'
    volumes:
      - turblog-server-data:/var/lib/turblog

volumes:
  turblog-server-data:
