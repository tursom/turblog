services:
  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: '1.40'
    command:
      - --http-api-update
      - --http-api-token=${WATCHTOWER_HTTP_API_TOKEN:?WATCHTOWER_HTTP_API_TOKEN is required}
      - --label-enable
      - --cleanup
      - --interval=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - blog
      - watchtower
    ports:
      - '${BLOG_PORT:-8080}:8080'
    volumes:
      - ./nginx.webhook.conf:/etc/nginx/conf.d/default.conf:ro
