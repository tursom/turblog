services:
  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: '1.40'
    command:
      - --http-api-update
      - --http-api-token=${WATCHTOWER_HTTP_API_TOKEN:?WATCHTOWER_HTTP_API_TOKEN is required}
      - --label-enable
      - --cleanup
      - --interval=0
    ports:
      - '${WATCHTOWER_PORT:-8090}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
