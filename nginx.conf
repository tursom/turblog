server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  location = /book-access-manifest.json {
    return 404;
  }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location = /archives/54.html { return 301 /posts/windows-server-2022-smb/; }
  location = /archives/52.html { return 301 /posts/wireshark-rpcapd-remote-capture/; }
  location = /archives/50.html { return 301 /posts/gitea-rst-format/; }
  location = /archives/45.html { return 301 /posts/row-linked-list/; }
  location = /archives/44.html { return 301 /posts/array-based-linked-list/; }
  location = /archives/43.html { return 301 /posts/two-cup-water-problem/; }
  location = /archives/42.html { return 301 /posts/cglib-research/; }
  location = /archives/40.html { return 301 /posts/kotlin-visibility/; }
  location = /archives/39.html { return 301 /posts/ts-socket-sync-async/; }
  location = /archives/38.html { return 301 /posts/go-atomic-generics/; }
  location = /archives/21.html { return 301 /posts/at-the-mountains-of-madness/; }
  location = /archives/19.html { return 301 /posts/the-shadow-out-of-time/; }
  location = /archives/18.html { return 301 /posts/go-wasm-file-io/; }
  location = /archives/17.html { return 301 /posts/gnosis-safe-multisig-wallet/; }
  location = /archives/12.html { return 301 /posts/gnosis-safe-1-3-0-contract/; }
  location ~ ^/archives/Typecho-1-2-0-sqlite-.*\.html$ {
    return 301 /posts/typecho-1-2-0-sqlite-install-bug/;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
